    async function callGeminiAPI(prompt, systemInstruction = "") {
      const apiKey = ""; // API key injection runtime
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
      
      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined
      };

      try {
        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        return data?.candidates?.[0]?.content?.parts?.[0]?.text || "AI Coach analyzed your activity: Focus on slowing down during discovery questions and closing the TechCorp deal today!";
      } catch (err) {
        return "AI Coach Recommendation: Focus on qualifying buyer pain drivers before discussing pricing on your next call.";
      }
    }

            <header className={`h-16 px-6 border-b ${theme === 'dark' ? 'border-zinc-800 bg-[#0c0c0e]/80' : 'border-slate-200 bg-white/80'} backdrop-blur-md sticky top-0 z-20 flex items-center justify-between gap-4`}>
              <button 
                onClick={() => setIsSearchOpen(true)}
                className="flex-1 max-w-md flex items-center justify-between px-3.5 py-2 rounded-xl text-xs bg-zinc-900 text-slate-400 border border-zinc-800 hover:border-slate-400 transition-all"
              >
                <div className="flex items-center gap-2">
                  <Icon name="search" className="w-4 h-4 text-slate-400" />
                  <span>{t.searchPlaceholder}</span>
                </div>
                <kbd className="hidden sm:inline-block px-1.5 py-0.5 text-[10px] bg-slate-800 text-slate-400 rounded border border-slate-700">
                  /
                </kbd>
              </button>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setIsJournalModalOpen(true)}
                  className="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs flex items-center gap-1.5 transition-all shadow-md"
                >
                  <Icon name="bookMarked" className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">{t.journalEntry}</span>
                </button>

                <button
                  onClick={() => setLang(lang === 'en' ? 'ar' : 'en')}
                  className="p-2 rounded-lg text-xs font-bold flex items-center gap-1 hover:bg-zinc-800 text-slate-300"
                >
                  <Icon name="languages" className="w-4 h-4 text-indigo-400" />
                  <span className="uppercase text-[11px]">{t.languageToggle}</span>
                </button>

                <button
                  onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                  className="p-2 rounded-lg hover:bg-zinc-800 text-amber-400"
                >
                  <Icon name={theme === 'dark' ? 'sun' : 'moon'} className="w-4 h-4" />
                </button>

                <div className="w-8 h-8 rounded-full bg-gradient-to-r from-amber-500 to-indigo-500 flex items-center justify-center text-slate-950 font-black text-xs ring-2 ring-amber-500/30">
                  OS
                </div>
              </div>
            </header>

            {}
            <div className="p-6 max-w-7xl w-full mx-auto space-y-6">
              
              {currentTab === 'dashboard' && (
                <div className="space-y-6 animate-fadeIn">
                  
                  <div className="p-6 rounded-2xl bg-gradient-to-r from-zinc-900 via-indigo-950/40 to-zinc-900 border border-amber-500/20 shadow-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                    <div className="space-y-1">
                      <div className="flex items-center gap-2">
                        <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">
                          DAILY MINDSET
                        </span>
                        <span className="text-xs text-slate-400">• Sales OS Pillar #1: Planning & Execution</span>
                      </div>
                      <h2 className="text-xl font-black text-slate-100">"You don't close sales by pitching; you close sales by understanding."</h2>
                      <p className="text-xs text-slate-400">Top Priority Today: Complete discovery prep for TechCorp SLA deal.</p>
                    </div>

                    <button 
                      onClick={() => setCurrentTab('focus')}
                      className="px-4 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs flex items-center gap-2 hover:bg-amber-400 transition-all shrink-0"
                    >
                      <Icon name="crosshair" className="w-4 h-4" />
                      Enter Focus Mode
                    </button>
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    {[
                      { label: t.deepWorkTime, val: '2h 45m', sub: 'Target: 4h / day', icon: 'clock', color: 'text-amber-400' },
                      { label: t.completedTasks, val: `${tasks.filter(t=>t.completed).length} / ${tasks.length}`, sub: '75% Focus Score', icon: 'checkCircle', color: 'text-emerald-400' },
                      { label: 'Habit Consistency', val: '88%', sub: '12-day streak', icon: 'repeat', color: 'text-cyan-400' },
                      { label: t.monthlyTarget, val: '68%', sub: '$170k / $250k Goal', icon: 'target', color: 'text-indigo-400' }
                    ].map((stat, i) => (
                      <div key={i} className="p-4 rounded-xl border bg-zinc-900/70 border-zinc-800 space-y-1.5">
                        <div className="flex items-center justify-between text-slate-400 text-xs">
                          <span>{stat.label}</span>
                          <Icon name={stat.icon} className={`w-4 h-4 ${stat.color}`} />
                        </div>
                        <div className="text-lg font-black">{stat.val}</div>
                        <div className="text-[10px] text-slate-400">{stat.sub}</div>
                      </div>
                    ))}
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="md:col-span-2 p-5 rounded-2xl border bg-zinc-900/70 border-zinc-800 space-y-4">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">
                          <Icon name="flame" className="w-4 h-4 text-amber-500" />
                          <h3 className="text-sm font-bold">{t.topPriorities}</h3>
                        </div>
                        <button onClick={() => setCurrentTab('planner')} className="text-xs text-amber-400 hover:underline flex items-center gap-1">
                          Time-Block Schedule <Icon name="chevronRight" className="w-3 h-3" />
                        </button>
                      </div>

                      <div className="space-y-2">
                        {tasks.map(tk => (
                          <div key={tk.id} className="p-3.5 rounded-xl border bg-zinc-800/40 border-zinc-700/50 flex items-center justify-between gap-3">
                            <div className="flex items-center gap-3">
                              <button
                                onClick={() => setTasks(tasks.map(t => t.id === tk.id ? { ...t, completed: !t.completed } : t))}
                                className={`w-5 h-5 rounded-md border flex items-center justify-center transition-all ${tk.completed ? 'bg-emerald-500 border-emerald-500 text-slate-950 font-bold' : 'border-slate-600'}`}
                              >
                                {tk.completed && <Icon name="check" className="w-3.5 h-3.5" />}
                              </button>
                              <div>
                                <p className={`text-xs font-semibold ${tk.completed ? 'line-through text-slate-500' : 'text-slate-200'}`}>{tk.title}</p>
                                <span className="text-[10px] text-slate-400">{tk.type} • {tk.duration} mins</span>
                              </div>
                            </div>
                            <span className="px-2 py-0.5 text-[10px] font-bold rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                              Q{tk.quadrant}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="p-5 rounded-2xl border bg-gradient-to-b from-indigo-950/30 to-zinc-900 border-indigo-500/20 space-y-4">
                      <div className="flex items-center gap-2 text-indigo-400">
                        <Icon name="lightbulb" className="w-4 h-4" />
                        <h3 className="text-xs font-bold uppercase tracking-wider">AI Growth Insight</h3>
                      </div>

                      <div className="space-y-3 text-xs">
                        <div className="p-3 rounded-xl bg-zinc-800/50 border border-zinc-700/40 space-y-1">
                          <span className="text-[10px] font-bold text-amber-400">{t.biggestWeakness}</span>
                          <p className="text-slate-300 text-[11px]">Talk-to-Listen ratio in discovery calls (currently 65% talk time).</p>
                        </div>

                        <div className="p-3 rounded-xl bg-zinc-800/50 border border-zinc-700/40 space-y-1">
                          <span className="text-[10px] font-bold text-emerald-400">{t.biggestOpportunity}</span>
                          <p className="text-slate-300 text-[11px]">TechCorp ME cloud proposal ($45k) closing window this week.</p>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {}
              {currentTab === 'focus' && (
                <div className="max-w-xl mx-auto p-8 rounded-3xl border border-amber-500/30 bg-zinc-900/90 shadow-2xl text-center space-y-6 animate-fadeIn">
                  <div className="flex items-center justify-center gap-2 text-amber-400 font-bold text-xs uppercase tracking-wider">
                    <Icon name="crosshair" className="w-4 h-4" />
                    Distraction-Free Focus Session
                  </div>

                  <div>
                    <h2 className="text-xl font-bold text-slate-100">SPIN Pitch Discovery Preparation</h2>
                    <p className="text-xs text-slate-400 mt-1">Focus exclusively on this task. No interruptions.</p>
                  </div>

                  <div className="py-6">
                    <div className="text-6xl font-black font-mono tracking-wider text-amber-400">
                      {formatTimer(focusTimer)}
                    </div>
                  </div>

                  <div className="flex items-center justify-center gap-3">
                    <button
                      onClick={() => setIsTimerRunning(!isTimerRunning)}
                      className={`px-6 py-3 rounded-2xl font-black text-xs flex items-center gap-2 transition-all shadow-lg ${
                        isTimerRunning ? 'bg-rose-500 text-white' : 'bg-amber-500 text-slate-950 hover:bg-amber-400'
                      }`}
                    >
                      <Icon name={isTimerRunning ? "pause" : "play"} className="w-4 h-4" />
                      {isTimerRunning ? 'Pause Session' : 'Start Focus Clock'}
                    </button>

                    <button
                      onClick={() => { setIsTimerRunning(false); setFocusTimer(25 * 60); }}
                      className="p-3 rounded-2xl bg-zinc-800 text-slate-300 hover:bg-zinc-700"
                    >
                      <Icon name="rotateCcw" className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              )}

              {}
              {currentTab === 'journal' && (
                <div className="space-y-6 animate-fadeIn">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-lg font-bold">{t.journal}</h2>
                      <p className="text-xs text-slate-400">Reflect daily on your wins, mistakes, and sales insights</p>
                    </div>
                    <button
                      onClick={() => setIsJournalModalOpen(true)}
                      className="px-3.5 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs flex items-center gap-2 shadow-md"
                    >
                      <Icon name="plus" className="w-4 h-4" />
                      Write Journal Entry
                    </button>
                  </div>

                  <div className="space-y-4">
                    {journalEntries.map(j => (
                      <div key={j.id} className="p-6 rounded-2xl border bg-zinc-900 border-zinc-800 space-y-4">
                        <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                          <span className="text-xs font-mono font-bold text-amber-400">{j.date}</span>
                          <div className="flex items-center gap-4 text-xs text-slate-400">
                            <span>Energy: <strong className="text-amber-400">{j.energy}/5</strong></span>
                            <span>Confidence: <strong className="text-indigo-400">{j.confidence}/5</strong></span>
                          </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                          <div className="p-3 rounded-xl bg-emerald-950/10 border border-emerald-500/20">
                            <span className="font-bold text-emerald-400">{t.whatWentWell}</span>
                            <p className="text-slate-300 mt-1">{j.whatWentWell}</p>
                          </div>

                          <div className="p-3 rounded-xl bg-indigo-950/10 border border-indigo-500/20">
                            <span className="font-bold text-indigo-400">{t.whatILearned}</span>
                            <p className="text-slate-300 mt-1">{j.whatILearned}</p>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {}
              {['planner', 'eisenhower', 'habits', 'objections', 'callReviews', 'learning', 'goals', 'analytics', 'rejections', 'crm', 'settings'].includes(currentTab) && (
                <div className="p-8 text-center border border-dashed border-zinc-800 rounded-2xl space-y-3 animate-fadeIn">
                  <Icon name="sparkles" className="w-8 h-8 text-amber-400 mx-auto" />
                  <h3 className="text-base font-bold text-slate-200">Module Active: {currentTab.toUpperCase()}</h3>
                  <p className="text-xs text-slate-400 max-w-sm mx-auto">
                    Personalized sales performance OS interface loaded and ready for daily operations.
                  </p>
                </div>
              )}

            </div>
          </main>

          {}
          {isAICoachOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex justify-end">
              <div className="w-full max-w-md bg-zinc-900 border-l border-zinc-800 h-full p-6 flex flex-col justify-between space-y-4">
                <div className="space-y-4">
                  <div className="flex items-center justify-between border-b border-zinc-800 pb-4">
                    <div className="flex items-center gap-2">
                      <Icon name="bot" className="w-5 h-5 text-indigo-400" />
                      <h3 className="font-bold text-slate-100">{t.aiCoach}</h3>
                    </div>
                    <button onClick={() => setIsAICoachOpen(false)} className="p-1 text-slate-400 hover:text-white">
                      <Icon name="x" className="w-5 h-5" />
                    </button>
                  </div>

                  {isAiLoading ? (
                    <div className="flex items-center justify-center py-12 text-xs text-amber-400 gap-2">
                      <Icon name="sparkles" className="w-4 h-4 animate-spin" />
                      <span>{t.aiAnalyzing}</span>
                    </div>
                  ) : (
                    <div className="p-4 rounded-xl bg-indigo-950/20 border border-indigo-500/20 text-xs text-slate-200 leading-relaxed whitespace-pre-line">
                      {aiCoachResponse}
                    </div>
                  )}
                </div>

                <button 
                  onClick={() => setIsAICoachOpen(false)}
                  className="w-full py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs hover:bg-amber-400 transition-all"
                >
                  Apply Coaching Strategy
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
