        shieldAlert: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM12 8v4M12 16h.01"/>,
        note: <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M9 13h6M9 17h6"/>,
        target: <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 16a6 6 0 1 1 0-12 6 6 0 0 1 0 12zm0-8a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>

      return (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
          strokeLinecap="round" strokeLinejoin="round" className={className} style={flip ? { transform: 'scaleX(-1)' } : undefined}>
          {icons[name] || <circle cx="12" cy="12" r="10" />}

    const STAGES = ['Lead', 'Discovery', 'Proposal', 'Negotiation', 'Won', 'Lost'];
    const STAGE_COLORS = {

    const TRANSLATIONS = {

    const INITIAL_HABITS = [
      { id: 'h1', title: 'Morning Sales Planning (15m)', streak: 12, completedToday: true },
      { id: 'h2', title: 'Outbound Prospecting (10 Contacts)', streak: 5, completedToday: false },
      { id: 'h3', title: 'Post-Call Debrief & AI Review', streak: 8, completedToday: true },
      { id: 'h4', title: 'Read 20 min of Sales Methodology', streak: 15, completedToday: false }
    ];

    const INITIAL_JOURNAL = [
      {
        id: 'j1', date: '2026-07-26',
        whatWentWell: "Handled price pushback well during TechCorp ME demo using ROI math.",
        whatWentWrong: "Rushed through discovery phase without finding true pain driver.",
        whatILearned: "When buyers ask for price immediately, reframe to discovery before giving numbers.",
        whatToImprove: "Slow down questions during discovery calls tomorrow.",
        energy: 4, confidence: 5
      }
    ];

    const INITIAL_TASKS = [
      { id: 't1', title: 'Prepare SPIN discovery questions for Apex Holding', duration: 25, completed: false },
      { id: 't2', title: 'Read Chapter 4 of SPIN Selling book', duration: 20, completed: true },
      { id: 't3', title: "Review today's TechCorp objection recording with AI", duration: 15, completed: false },
      { id: 't4', title: 'Clean up outdated contact phone numbers in CRM', duration: 10, completed: false }
    ];

    const INITIAL_DEALS = [
      {
        id: 'd1', name: 'TechCorp ME', value: 45000, stage: 'Negotiation',
        notes: [
          { id: 'n1', type: 'call', date: '2026-07-24', content: 'Discovery call — identified pain point around SLA guarantees.' },
          { id: 'n2', type: 'objection', date: '2026-07-25', content: "Price is 30% higher than CloudFlex — reframed to ROI: SLA outage costs $50k+." }
        ]
      },
      {
        id: 'd2', name: 'Apex Holding', value: 22000, stage: 'Discovery',
        notes: [
          { id: 'n3', type: 'call', date: '2026-07-23', content: 'Intro call scheduled, prepping SPIN questions.' }
        ]
      }
    ];

    // NOTE: apiKey is intentionally empty — plug in a real Gemini API key at runtime for live AI Coach responses.
    async function callGeminiAPI(prompt) {
      const apiKey = "";
      if (!apiKey) {
        return "AI Coach Recommendation: Focus on qualifying buyer pain drivers before discussing pricing on your next call.";
      }
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
      try {
        const res = await fetch(apiUrl, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        return data?.candidates?.[0]?.content?.parts?.[0]?.text || "AI Coach: Focus on slowing down during discovery and closing the TechCorp deal today!";
      } catch (err) {
        return "AI Coach Recommendation: Focus on qualifying buyer pain drivers before discussing pricing on your next call.";
      }
    }

    const EMPTY_JOURNAL_FORM = { whatWentWell: '', whatWentWrong: '', whatILearned: '', whatToImprove: '', energy: 4, confidence: 5 };
    const EMPTY_DEAL_FORM = { name: '', value: '', stage: 'Lead' };

    function App() {
      const [lang, setLang] = useState('en');
      const [theme, setTheme] = useState('dark');
      const [currentTab, setCurrentTab] = useState('dashboard');

      const [habits, setHabits] = useState(INITIAL_HABITS);
      const [journalEntries, setJournalEntries] = useState(INITIAL_JOURNAL);
      const [tasks, setTasks] = useState(INITIAL_TASKS);
      const [deals, setDeals] = useState(INITIAL_DEALS);

      const [focusTimer, setFocusTimer] = useState(25 * 60);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      const [searchQuery, setSearchQuery] = useState('');
      const [isSearchOpen, setIsSearchOpen] = useState(false);
      const [isAICoachOpen, setIsAICoachOpen] = useState(false);
      const [aiCoachResponse, setAiCoachResponse] = useState('');
      const [isAiLoading, setIsAiLoading] = useState(false);

      const [isFABOpen, setIsFABOpen] = useState(false);
      const [isJournalModalOpen, setIsJournalModalOpen] = useState(false);
      const [isDealModalOpen, setIsDealModalOpen] = useState(false);
      const [isAddingHabit, setIsAddingHabit] = useState(false);
      const [newHabitTitle, setNewHabitTitle] = useState('');

      const [newJournal, setNewJournal] = useState(EMPTY_JOURNAL_FORM);
      const [newDeal, setNewDeal] = useState(EMPTY_DEAL_FORM);

      const [expandedDealId, setExpandedDealId] = useState(null);
      const [noteDrafts, setNoteDrafts] = useState({});

      const t = TRANSLATIONS[lang];
      const isRTL = lang === 'ar';

      useEffect(() => { document.documentElement.dir = isRTL ? 'rtl' : 'ltr'; }, [lang]);

      useEffect(() => {
        let interval = null;
        if (isTimerRunning && focusTimer > 0) interval = setInterval(() => setFocusTimer(prev => prev - 1), 1000);
        else if (focusTimer === 0) setIsTimerRunning(false);
        return () => clearInterval(interval);
      }, [isTimerRunning, focusTimer]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
            e.preventDefault(); setIsSearchOpen(true);
          }
          if (e.key === 'Escape') { setIsSearchOpen(false); setIsFABOpen(false); }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const runAICoachAnalysis = async () => {
        setIsAiLoading(true); setIsAICoachOpen(true);
        const result = await callGeminiAPI("Give me 3 actionable tips for today's sales performance.");
        setAiCoachResponse(result); setIsAiLoading(false);
      };

      const formatTimer = (seconds) => {
        const m = Math.floor(seconds / 60), s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const addJournalEntry = () => {
        if (!newJournal.whatWentWell.trim() && !newJournal.whatILearned.trim()) return;
        setJournalEntries([{ id: 'j' + Date.now(), date: new Date().toISOString().split('T')[0], ...newJournal }, ...journalEntries]);
        setNewJournal(EMPTY_JOURNAL_FORM);
        setIsJournalModalOpen(false);
      };

      const addHabit = () => {
        if (!newHabitTitle.trim()) return;
        setHabits([...habits, { id: 'h' + Date.now(), title: newHabitTitle.trim(), streak: 0, completedToday: false }]);
        setNewHabitTitle(''); setIsAddingHabit(false);
      };

      const toggleHabit = (id) => {
        setHabits(habits.map(h => h.id === id
          ? { ...h, completedToday: !h.completedToday, streak: h.completedToday ? Math.max(0, h.streak - 1) : h.streak + 1 }
          : h));
      };

      const addDeal = () => {
        if (!newDeal.name.trim()) return;
        setDeals([{ id: 'd' + Date.now(), name: newDeal.name.trim(), value: Number(newDeal.value) || 0, stage: newDeal.stage, notes: [] }, ...deals]);
        setNewDeal(EMPTY_DEAL_FORM); setIsDealModalOpen(false);
      };

      const updateDealStage = (id, stage) => setDeals(deals.map(d => d.id === id ? { ...d, stage } : d));

      const addNoteToDeal = (dealId) => {
        const draft = noteDrafts[dealId];
        if (!draft || !draft.content || !draft.content.trim()) return;
        setDeals(deals.map(d => d.id === dealId
          ? { ...d, notes: [...d.notes, { id: 'n' + Date.now(), type: draft.type || 'note', date: new Date().toISOString().split('T')[0], content: draft.content.trim() }] }
          : d));
        setNoteDrafts({ ...noteDrafts, [dealId]: { type: 'note', content: '' } });
      };

      const searchableItems = useMemo(() => {
        const items = [];
        habits.forEach(h => items.push({ id: 'habit-' + h.id, title: h.title, type: t.habits, tab: 'habits' }));
        journalEntries.forEach(j => items.push({ id: 'jrn-' + j.id, title: j.whatWentWell || j.whatILearned, type: t.journal, tab: 'journal' }));
        tasks.forEach(tk => items.push({ id: 'task-' + tk.id, title: tk.title, type: t.dashboard, tab: 'dashboard' }));
        deals.forEach(d => {
          items.push({ id: 'deal-' + d.id, title: d.name, type: t.pipeline, tab: 'pipeline' });
          d.notes.forEach(n => items.push({ id: 'note-' + n.id, title: `${d.name}: ${n.content}`, type: t.pipeline, tab: 'pipeline' }));
        });
        return items;
      }, [habits, journalEntries, tasks, deals, t]);

      const filteredSearchResults = useMemo(() => {
        if (!searchQuery.trim()) return [];
        const q = searchQuery.toLowerCase();
        return searchableItems.filter(i => i.title.toLowerCase().includes(q));
      }, [searchQuery, searchableItems]);

      const goToTab = (tab) => { setCurrentTab(tab); setIsSearchOpen(false); setIsFABOpen(false); setSearchQuery(''); };

      const NAV_ITEMS = [
        { id: 'dashboard', icon: 'dashboard', label: t.dashboard },
        { id: 'focus', icon: 'crosshair', label: t.focusMode },
        { id: 'habits', icon: 'repeat', label: t.habits },
        { id: 'journal', icon: 'bookMarked', label: t.journal },
        { id: 'pipeline', icon: 'kanban', label: t.pipeline }

                    <div key={field.key}>
                      <label className="text-[11px] font-semibold text-slate-400">{field.label}</label>
                      <textarea value={newJournal[field.key]} onChange={e => setNewJournal({ ...newJournal, [field.key]: e.target.value })} rows={2}
                        className="w-full mt-1 p-2.5 rounded-xl bg-zinc-800/60 border border-zinc-700 text-xs text-slate-100 outline-none focus:border-amber-500 resize-none" />
                    </div>
                  ))}
                  <div className="grid grid-cols-2 gap-4 pt-1">
                    <div>
                      <label className="text-[11px] font-semibold text-slate-400">{t.energy} ({newJournal.energy}/5)</label>
                      <input type="range" min="1" max="5" value={newJournal.energy} onChange={e => setNewJournal({ ...newJournal, energy: Number(e.target.value) })} className="w-full accent-amber-500" />
                    </div>
                    <div>
                      <label className="text-[11px] font-semibold text-slate-400">{t.confidence} ({newJournal.confidence}/5)</label>
                      <input type="range" min="1" max="5" value={newJournal.confidence} onChange={e => setNewJournal({ ...newJournal, confidence: Number(e.target.value) })} className="w-full accent-indigo-500" />
                    </div>
                  </div>
                </div>
                <div className="flex items-center gap-2 pt-2">
                  <button onClick={() => setIsJournalModalOpen(false)} className="flex-1 py-2.5 rounded-xl bg-zinc-800 text-slate-300 font-bold text-xs hover:bg-zinc-700 transition-all">{t.cancel}</button>
                  <button onClick={addJournalEntry} className="flex-1 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs hover:bg-amber-400 transition-all">{t.save}</button>
                </div>
              </div>
            </div>
          )}

          {}
          {isDealModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center px-4" onClick={() => setIsDealModalOpen(false)}>
              <div className="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl p-6 space-y-4 animate-fadeIn" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
                  <h3 className="font-bold text-sm text-slate-100">{t.addDeal}</h3>
                  <button onClick={() => setIsDealModalOpen(false)} className="p-1 text-slate-400 hover:text-white"><Icon name="x" className="w-4 h-4" /></button>
                </div>
                <div className="space-y-3">
                  <div>
                    <label className="text-[11px] font-semibold text-slate-400">{t.dealName}</label>
                    <input autoFocus value={newDeal.name} onChange={e => setNewDeal({ ...newDeal, name: e.target.value })}
                      className="w-full mt-1 p-2.5 rounded-xl bg-zinc-800/60 border border-zinc-700 text-xs text-slate-100 outline-none focus:border-amber-500" />
                  </div>
                  <div>
                    <label className="text-[11px] font-semibold text-slate-400">{t.dealValue}</label>
                    <input type="number" value={newDeal.value} onChange={e => setNewDeal({ ...newDeal, value: e.target.value })}
                      className="w-full mt-1 p-2.5 rounded-xl bg-zinc-800/60 border border-zinc-700 text-xs text-slate-100 outline-none focus:border-amber-500" />
                  </div>
                  <div>
                    <label className="text-[11px] font-semibold text-slate-400">{t.pipeline}</label>
                    <select value={newDeal.stage} onChange={e => setNewDeal({ ...newDeal, stage: e.target.value })}
                      className="w-full mt-1 p-2.5 rounded-xl bg-zinc-800/60 border border-zinc-700 text-xs text-slate-100 outline-none focus:border-amber-500">
                      {STAGES.map(s => <option key={s} value={s}>{t['stage' + s]}</option>)}
                    </select>
                  </div>
                </div>
                <div className="flex items-center gap-2 pt-2">
                  <button onClick={() => setIsDealModalOpen(false)} className="flex-1 py-2.5 rounded-xl bg-zinc-800 text-slate-300 font-bold text-xs hover:bg-zinc-700 transition-all">{t.cancel}</button>
                  <button onClick={addDeal} className="flex-1 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs hover:bg-amber-400 transition-all">{t.save}</button>
                </div>
              </div>
            </div>
          )}

          {}
          {isAICoachOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex justify-end">
              <div className="w-full max-w-md bg-zinc-900 border-l border-zinc-800 h-full p-6 flex flex-col justify-between space-y-4">
                <div className="space-y-4">
                  <div className="flex items-center justify-between border-b border-zinc-800 pb-4">
                    <div className="flex items-center gap-2"><Icon name="bot" className="w-5 h-5 text-indigo-400" /><h3 className="font-bold text-slate-100">{t.aiCoach}</h3></div>
                    <button onClick={() => setIsAICoachOpen(false)} className="p-1 text-slate-400 hover:text-white"><Icon name="x" className="w-5 h-5" /></button>
                  </div>
                  {isAiLoading ? (
                    <div className="flex items-center justify-center py-12 text-xs text-amber-400 gap-2"><Icon name="sparkles" className="w-4 h-4 animate-spin" /><span>{t.aiAnalyzing}</span></div>
                  ) : (
                    <div className="p-4 rounded-xl bg-indigo-950/20 border border-indigo-500/20 text-xs text-slate-200 leading-relaxed whitespace-pre-line">{aiCoachResponse}</div>
                  )}
                </div>
                <button onClick={() => setIsAICoachOpen(false)} className="w-full py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs hover:bg-amber-400 transition-all">{t.applyCoaching}</button>
              </div>
            </div>
          )}

          {}
          <div className={`fixed bottom-6 ${isRTL ? 'left-6' : 'right-6'} z-40 flex flex-col items-end gap-2`}>
            {isFABOpen && (
              <div className="flex flex-col gap-2 animate-fadeIn">
                <button onClick={() => { setIsFABOpen(false); setIsJournalModalOpen(true); }} className="px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-700 text-xs font-semibold text-slate-200 hover:border-amber-500 shadow-lg flex items-center gap-2">
                  <Icon name="bookMarked" className="w-3.5 h-3.5 text-amber-400" />{t.writeJournalEntry}
                </button>
                <button onClick={() => goToTab('habits')} className="px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-700 text-xs font-semibold text-slate-200 hover:border-amber-500 shadow-lg flex items-center gap-2">
                  <Icon name="repeat" className="w-3.5 h-3.5 text-cyan-400" />{t.addHabit}
                </button>
                <button onClick={() => { setIsFABOpen(false); setIsDealModalOpen(true); }} className="px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-700 text-xs font-semibold text-slate-200 hover:border-amber-500 shadow-lg flex items-center gap-2">
                  <Icon name="kanban" className="w-3.5 h-3.5 text-rose-400" />{t.addDeal}
                </button>
              </div>
            )}
            <button onClick={() => setIsFABOpen(!isFABOpen)} className="w-14 h-14 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-2xl flex items-center justify-center transition-all" title={t.quickAction}>
              <Icon name={isFABOpen ? 'x' : 'plus'} className="w-6 h-6" />
            </button>
          </div>

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
