    // Audio Chime synthesizer via Web Audio API (Zero external assets needed)
    function playChimeSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          gain.gain.setValueAtTime(0.2, now + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 0.35);
        });
      } catch (e) {
        // AudioContext might be blocked until user gesture, safely ignore
      }

    // ============ SMART LOCAL AI COACH ENGINE ============
    function generateSmartLocalCoaching(deals, tasks, habits, lang) {
      const isAr = lang === 'ar';
      const openHigh = tasks.filter(tk => !tk.completed && tk.priority === 'High');
      const activeDeals = deals.filter(d => d.stage !== 'Won' && d.stage !== 'Lost');
      const negDeals = deals.filter(d => d.stage === 'Negotiation' || d.stage === 'Proposal');
      const weakHabits = habits.filter(h => !h.completedToday);

      const tips = [];

      if (negDeals.length > 0) {
        const topD = negDeals[0];
        tips.push(isAr
          ? `🎯 صفقة في مرحلة حاسمة: لديك صفقة "${topD.name}" بقيمة $${topD.value.toLocaleString()} في مرحلة (${topD.stage}). لا تقدم تنازلات في السعر؛ استخدم ميزان بنجامين فرانكلين وحاسبة فجوة القيمة (COI)، واعرض بديلين محددين (X أو Y) لإغلاق التعاقد.`
          : `🎯 Critical Closing Opportunity: You have "${topD.name}" ($${topD.value.toLocaleString()}) in ${topD.stage}. Avoid discounting; reframe with the Value Gap & ROI math, and offer two specific alternatives to lock the close.`);
      } else if (activeDeals.length > 0) {
        tips.push(isAr
          ? `🚀 تحريك القمع: لديك ${activeDeals.length} صفقات نشطة في مرحلة الاستكشاف. طبق نموذج الدكتور (Pain + Press + Solve) ولا تعرض الحل قبل تسعير كلفة الألم مع العميل.`
          : `🚀 Pipeline Velocity: You have ${activeDeals.length} active deals in discovery. Use the Doctor Method (Pain + Press + Solve) to quantify the cost of inaction before presenting your solution.`);
      } else {
        tips.push(isAr
          ? `⚡ تنشيط قمع المبيعات: القمع يحتاج لضخ عملاء جدد اليوم. ركز على إجراء 10 مكالمات استكشافية بتكنيك التريلر في أول 30 ثانية لتأمين 3 مواعيد.`
          : `⚡ Pipeline Injection: Your pipeline needs fresh leads. Focus on 10 outbound trailer calls in the first 30s to secure 3 qualified meetings.`);
      }

      if (openHigh.length > 0) {
        tips.push(isAr
          ? `⏰ أولوية اليوم القصوى: مهمة "${openHigh[0].title}" مصنفة كأولوية عالية. ادخل وضع التركيز (Focus Mode) فوراً وأنجزها في أول 25 دقيقة قبل الانشغال بالأعمال الإدارية.`
          : `⏰ High-Priority Execution: "${openHigh[0].title}" is your #1 focus. Enter Focus Mode now to clear it in a 25-min distraction-free sprint.`);
      } else {
        tips.push(isAr
          ? `✅ إدارة الطاقة: مصفوفة أولوياتك خالية من الضغوط العاجلة. استغل هذا الوقت في بناء علاقات دافئة مع العملاء السابقين أو طلب إحالات (Referrals).`
          : `✅ Energy Leverage: No urgent high-priority fires. Use this clarity to nurture past client relationships and ask for warm referrals.`);
      }

      if (weakHabits.length > 0) {
        tips.push(isAr
          ? `🔥 ثبات العادات (1% Daily Bridge): عادة "${weakHabits[0].title}" لم تكتمل اليوم بعد. النجاح في المبيعات هو تراكم عادات هندسية ثابتة، احرص على إتمامها للحفاظ على السلسلة.`
          : `🔥 Habit Consistency (1% Bridge): "${weakHabits[0].title}" is pending today. Sales mastery is built on non-negotiable daily routines; check it off to protect your streak.`);
      } else {
        tips.push(isAr
          ? `🌟 انضباط استثنائي: أتممت عاداتك البيعية اليوم بنسبة 100%! حافظ على هذا الزخم الذهني واختم يومك بتدوين تأمل في يومية المبيعات.`
          : `🌟 Flawless Discipline: 100% of your daily sales habits are completed! Carry this momentum into your evening debrief in the Sales Journal.`);
      }

      return tips.join('\n\n');
    }

    // Call Gemini API if user configured key, otherwise fallback cleanly
    async function callGeminiAPI(prompt, apiKey) {
      if (!apiKey) return null;
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
      try {
        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        return data?.candidates?.[0]?.content?.parts?.[0]?.text || null;
      } catch (err) {
        return null;
      }
    }

    // ==========================================
    // AUTH MODAL (OPTIONAL - GUESTS CAN OPEN AT WILL)
    // ==========================================
    function AuthModal({ isOpen, onClose, t, onLoginSuccess, currentGuestData }) {
      const [mode, setMode] = useState('login');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [keepData, setKeepData] = useState(true);
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState('');
      const [info, setInfo] = useState('');

      if (!isOpen) return null;

      const submit = async () => {
        if (!email.trim() || !password.trim()) return;
        setBusy(true); setError(''); setInfo('');
        try {
          const cleanEmail = email.trim().toLowerCase();
          if (SUPABASE_READY) {
            if (mode === 'login') {
              const { data, error } = await supabaseClient.auth.signInWithPassword({ email: cleanEmail, password });
              if (error) throw error;
              onLoginSuccess({ id: data.session.user.id, email: data.session.user.email, isGuest: false }, keepData);
            } else {
              const { data, error } = await supabaseClient.auth.signUp({ email: cleanEmail, password });
              if (error) throw error;
              if (data.session) {
                onLoginSuccess({ id: data.session.user.id, email: data.session.user.email, isGuest: false }, keepData);
              } else {
                setInfo(t.checkEmailConfirm);
              }
            }
          } else {
            const accounts = readAccounts();
            if (mode === 'signup') {
              if (accounts[cleanEmail]) throw new Error('EMAIL_TAKEN');
              accounts[cleanEmail] = { email: cleanEmail, password, createdAt: Date.now() };
              writeAccounts(accounts);
              onLoginSuccess({ id: cleanEmail, email: cleanEmail, isGuest: false }, keepData);
            } else {
              const rec = accounts[cleanEmail];
              if (!rec) throw new Error('NOT_FOUND');
              if (rec.password !== password) throw new Error('WRONG_PASSWORD');
              onLoginSuccess({ id: cleanEmail, email: rec.email, isGuest: false }, keepData);
            }
          }
          onClose();
        } catch (err) {
          const code = err && err.message;
          const map = { EMAIL_TAKEN: t.emailTaken, NOT_FOUND: t.accountNotFound, WRONG_PASSWORD: t.wrongPassword };
          setError(map[code] || code || t.authGenericError);
        } finally {
          setBusy(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4" onClick={onClose}>
          <div className="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl p-6 space-y-4 animate-fadeIn" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between border-b border-zinc-800 pb-3">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center">
                  <Icon name="user" className="w-4 h-4" />
                </div>
                <div>
                  <h3 className="font-extrabold text-sm text-slate-100">{mode === 'login' ? t.welcomeBack : t.createAccount}</h3>
                  <p className="text-[10px] text-amber-400 font-medium">{t.loginOrSignup}</p>
                </div>
              </div>
              <button onClick={onClose} aria-label={t.close} className="p-1 text-slate-400 hover:text-white">
                <Icon name="x" className="w-4 h-4" />
              </button>
            </div>

            <p className="text-[11px] text-slate-400 leading-relaxed">
              {t.localModeAuthNotice}
            </p>

            <div className="space-y-3">
              <div>
                <label className="text-[11px] font-semibold text-slate-400">{t.email}</label>
                <input type="email" autoFocus value={email} onChange={e => setEmail(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && submit()}
                  placeholder="sales@example.com"
                  className="w-full mt-1 p-2.5 rounded-xl bg-zinc-800/60 border border-zinc-700 text-xs text-slate-100 outline-none focus:border-amber-500" />
              </div>
              <div>
                <label className="text-[11px] font-semibold text-slate-400">{t.password}</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && submit()}
                  placeholder="••••••••"
                  className="w-full mt-1 p-2.5 rounded-xl bg-zinc-800/60 border border-zinc-700 text-xs text-slate-100 outline-none focus:border-amber-500" />
              </div>

              <label className="flex items-center gap-2 cursor-pointer pt-1">
                <input type="checkbox" checked={keepData} onChange={e => setKeepData(e.target.checked)} className="accent-amber-500 rounded" />
                <span className="text-[11px] text-slate-300 font-medium">{t.keepGuestData}</span>
              </label>
            </div>

            {error && <p className="text-[11px] text-rose-400 bg-rose-500/10 p-2 rounded-lg border border-rose-500/20">{error}</p>}
            {info && <p className="text-[11px] text-emerald-400 bg-emerald-500/10 p-2 rounded-lg border border-emerald-500/20">{info}</p>}

            <button onClick={submit} disabled={busy}
              className="w-full py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs hover:bg-amber-400 transition-all disabled:opacity-50 shadow-md">
              {busy ? (mode === 'login' ? t.loggingIn : t.signingUp) : (mode === 'login' ? t.login : t.signup)}
            </button>

            <div className="flex items-center justify-between text-[11px] text-slate-400 pt-2 border-t border-zinc-800/80">
              <button onClick={() => { setMode(mode === 'login' ? 'signup' : 'login'); setError(''); setInfo(''); }} className="text-amber-400 font-semibold hover:underline">
                {mode === 'login' ? t.noAccountYet : t.haveAccountAlready}
              </button>
              <button onClick={onClose} className="text-slate-500 hover:text-slate-300">
                {t.continueAsGuest}
              </button>
            </div>
          </div>
        </div>
      );
    }

      const [isFABOpen, setIsFABOpen] = useState(false);
      const [isJournalModalOpen, setIsJournalModalOpen] = useState(false);
      const [isDealModalOpen, setIsDealModalOpen] = useState(false);
      const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
      const [isAddingHabit, setIsAddingHabit] = useState(false);
      const [newHabitTitle, setNewHabitTitle] = useState('');

      const [newJournal, setNewJournal] = useState(EMPTY_JOURNAL_FORM);
      const [newDeal, setNewDeal] = useState(EMPTY_DEAL_FORM);
      const [newTask, setNewTask] = useState(EMPTY_TASK_FORM);
      const [taskFormError, setTaskFormError] = useState('');
      const [dealFormError, setDealFormError] = useState('');

      const [expandedDealId, setExpandedDealId] = useState(null);
      const [toast, setToast] = useState(null);
      const toastTimerRef = useRef(null);
      const [noteDrafts, setNoteDrafts] = useState({});

      const dataLoadedRef = useRef(false);
      const saveTimerRef = useRef(null);

      const showToast = (message) => {
        setToast(message);
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        toastTimerRef.current = setTimeout(() => setToast(null), 2800);
      };

      // Keep html dir and lang attribute in sync
      useEffect(() => {
        document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
        document.title = lang === 'ar' ? 'Sales OS - نظام التشغيل الشخصي للمبيعات' : 'Sales OS - Personal Sales Operating System';
        localStorage.setItem(LS_LANG_KEY, lang);
      }, [lang, isRTL]);

      // Focus Mode Countdown with drift-prevention
      useEffect(() => {
        let interval = null;
        if (isTimerRunning) {
          if (!timerEndRef.current) {
            timerEndRef.current = Date.now() + focusTimer * 1000;
          }
          interval = setInterval(() => {
            const remaining = Math.max(0, Math.round((timerEndRef.current - Date.now()) / 1000));
            setFocusTimer(remaining);
            if (remaining <= 0) {
              clearInterval(interval);
              setIsTimerRunning(false);
              timerEndRef.current = null;
              setTotalFocusMinutes(m => m + Math.round(FOCUS_DURATION / 60));
              setSessionJustCompleted(true);
              playChimeSound();
            }
          }, 300);
        } else {
          timerEndRef.current = null;
        }
        return () => clearInterval(interval);
      }, [isTimerRunning]);

      // Keyboard shortcuts
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
            e.preventDefault(); setIsSearchOpen(true);
          }
          if (e.key === 'Escape') {
            setIsSearchOpen(false);
            setIsFABOpen(false);
            setIsAuthModalOpen(false);
            setIsAICoachOpen(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Load user or guest data from storage
      useEffect(() => {
        let cancelled = false;
        (async () => {
          let saved = null;
          if (SUPABASE_READY && !session.isGuest) {
            const { data, error } = await supabaseClient
              .from('user_data')
              .select('data')
              .eq('user_id', session.id)
              .maybeSingle();
            if (!error && data && data.data) saved = data.data;
          } else {
            try {
              const raw = localStorage.getItem(LS_DATA_PREFIX + session.id);
              saved = raw ? JSON.parse(raw) : null;
            } catch (e) { saved = null; }
          }
          if (cancelled) return;
          if (saved) {
            if (Array.isArray(saved.habits)) setHabits(saved.habits);
            if (Array.isArray(saved.journalEntries)) setJournalEntries(saved.journalEntries);
            if (Array.isArray(saved.tasks)) setTasks(saved.tasks);
            if (Array.isArray(saved.deals)) setDeals(saved.deals);
            if (saved.calcForm && typeof saved.calcForm === 'object') setCalcForm(saved.calcForm);
            if (typeof saved.totalFocusMinutes === 'number') setTotalFocusMinutes(saved.totalFocusMinutes);
          }
          dataLoadedRef.current = true;
        })();
        return () => { cancelled = true; };
      }, [session.id]);

      // Auto-save data on change
      useEffect(() => {
        if (!dataLoadedRef.current) return;
        if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        saveTimerRef.current = setTimeout(() => {
          const payload = { habits, journalEntries, tasks, deals, calcForm, totalFocusMinutes };
          if (SUPABASE_READY && !session.isGuest) {
            supabaseClient.from('user_data').upsert({ user_id: session.id, data: payload, updated_at: new Date().toISOString() });
          } else {
            localStorage.setItem(LS_DATA_PREFIX + session.id, JSON.stringify(payload));
          }
        }, 600);
        return () => clearTimeout(saveTimerRef.current);
      }, [habits, journalEntries, tasks, deals, calcForm, totalFocusMinutes, session.id]);

      const handleLoginSuccess = (newSession, keepData) => {
        if (keepData) {
          const payload = { habits, journalEntries, tasks, deals, calcForm, totalFocusMinutes };
          localStorage.setItem(LS_DATA_PREFIX + newSession.id, JSON.stringify(payload));
        }
        localStorage.setItem(LS_SESSION_KEY, newSession.id);
        setSession(newSession);
        showToast(lang === 'ar' ? 'تم تسجيل الدخول بنجاح ومزامنة البيانات.' : 'Logged in successfully.');
      };

      const handleLogout = () => {
        if (!window.confirm(t.confirmLogout)) return;
        localStorage.removeItem(LS_SESSION_KEY);
        setSession({ id: GUEST_ID, email: 'Guest (وضع التجربة)', isGuest: true });
        showToast(lang === 'ar' ? 'تم تسجيل الخروج والعودة لوضع التجربة.' : 'Returned to Guest Mode.');
      };

      const openTasks = useMemo(() => tasks.filter(tk => !tk.completed), [tasks]);

      // AI Coach Analysis
      const runAICoachAnalysis = async () => {
        setIsAiLoading(true);
        setIsAICoachOpen(true);

        const openHigh = tasks.filter(tk => !tk.completed && tk.priority === 'High');
        const activeDeals = deals.filter(d => d.stage !== 'Won' && d.stage !== 'Lost');
        const objections = deals.flatMap(d => d.notes.filter(n => n.type === 'objection').map(n => `${d.name}: ${n.content}`));
        const weakHabits = habits.filter(h => !h.completedToday);

        const context = [
          `Open high-priority tasks: ${openHigh.map(tk => tk.title).join('; ') || 'none'}`,
          `Active deals: ${activeDeals.map(d => `${d.name} ($${d.value}, stage: ${d.stage})`).join('; ') || 'none'}`,
          `Recent objections logged: ${objections.slice(-3).join(' | ') || 'none'}`,
          `Habits pending today: ${weakHabits.map(h => h.title).join('; ') || 'none'}`
        ].join('\n');

        let result = null;
        if (geminiApiKey) {
          const prompt = `You are Omar Saied's senior sales performance coach. Analyze this real salesperson context and give exactly 3 concise, punchy, high-impact tactical bullet points in ${lang === 'ar' ? 'Arabic' : 'English'}:\n${context}`;
          result = await callGeminiAPI(prompt, geminiApiKey);
        }

        if (result) {
          setAiCoachResponse(result);
        } else {
          const localCoaching = generateSmartLocalCoaching(deals, tasks, habits, lang);
          setAiCoachResponse(localCoaching);
        }
        setIsAiLoading(false);
      };

      const formatTimer = (seconds) => {
        const m = Math.floor(seconds / 60), s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      // Actions
      const addJournalEntry = () => {
        if (!newJournal.whatWentWell.trim() && !newJournal.whatILearned.trim()) return;
        setJournalEntries([{ id: 'j' + Date.now(), date: new Date().toISOString().split('T')[0], ...newJournal }, ...journalEntries]);
        setNewJournal(EMPTY_JOURNAL_FORM);
        setIsJournalModalOpen(false);
      };
      const deleteJournalEntry = (id) => {
        if (!window.confirm(t.confirmDeleteJournal)) return;
        setJournalEntries(journalEntries.filter(j => j.id !== id));
      };

      const addHabit = () => {
        if (!newHabitTitle.trim()) return;
        setHabits([...habits, { id: 'h' + Date.now(), title: newHabitTitle.trim(), streak: 0, completedToday: false }]);
        setNewHabitTitle('');
        setIsAddingHabit(false);
      };
      const deleteHabit = (id) => {
        if (!window.confirm(t.confirmDeleteHabit)) return;
        setHabits(habits.filter(h => h.id !== id));
      };
      const toggleHabit = (id) => {
        setHabits(habits.map(h => h.id === id
          ? { ...h, completedToday: !h.completedToday, streak: h.completedToday ? Math.max(0, h.streak - 1) : h.streak + 1 }
          : h));
      };

      const addDeal = () => {
        if (!newDeal.name.trim()) { setDealFormError(t.dealNameRequired); return; }
        const val = Math.max(0, Number(newDeal.value) || 0);
        setDeals([{ id: 'd' + Date.now(), name: newDeal.name.trim(), value: val, stage: newDeal.stage, notes: [] }, ...deals]);
        setNewDeal(EMPTY_DEAL_FORM);
        setDealFormError('');
        setIsDealModalOpen(false);
      };
      const deleteDeal = (id) => {
        if (!window.confirm(t.confirmDeleteDeal)) return;
        setDeals(deals.filter(d => d.id !== id));
        if (expandedDealId === id) setExpandedDealId(null);
      };
      const updateDealStage = (id, stage) => {
        setDeals(deals.map(d => d.id === id ? { ...d, stage } : d));
        if (stage === 'Won') showToast(t.dealWonToast);
      };

      const addNoteToDeal = (dealId) => {
        const draft = noteDrafts[dealId];
        if (!draft || !draft.content || !draft.content.trim()) return;
        setDeals(deals.map(d => d.id === dealId
          ? { ...d, notes: [...d.notes, { id: 'n' + Date.now(), type: draft.type || 'note', date: new Date().toISOString().split('T')[0], content: draft.content.trim() }] }
          : d));
        setNoteDrafts({ ...noteDrafts, [dealId]: { type: 'note', content: '' } });
      };
      const deleteNote = (dealId, noteId) => {
        if (!window.confirm(t.confirmDeleteNote)) return;
        setDeals(deals.map(d => d.id === dealId ? { ...d, notes: d.notes.filter(n => n.id !== noteId) } : d));
      };

      const addTask = () => {
        if (!newTask.title.trim()) { setTaskFormError(t.taskTitleRequired); return; }
        setTasks([...tasks, {
          id: 't' + Date.now(),
          title: newTask.title.trim(),
          duration: Math.max(5, Number(newTask.duration) || 15),
          completed: false,
          category: newTask.category,
          priority: newTask.priority
        }]);
        setNewTask(EMPTY_TASK_FORM);
        setTaskFormError('');
        setIsTaskModalOpen(false);
      };
      const deleteTask = (id) => {
        if (!window.confirm(t.confirmDeleteTask)) return;
        setTasks(tasks.filter(tk => tk.id !== id));
        if (focusTaskId === id) setFocusTaskId(null);
      };
      const toggleTask = (id) => setTasks(tasks.map(tk => tk.id === id ? { ...tk, completed: !tk.completed } : tk));

      // Search
      const searchableItems = useMemo(() => {
        const items = [];
        habits.forEach(h => items.push({ id: 'habit-' + h.id, title: h.title, type: t.habits, tab: 'habits' }));
        journalEntries.forEach(j => items.push({ id: 'jrn-' + j.id, title: j.whatWentWell || j.whatILearned, type: t.journal, tab: 'journal' }));
        tasks.forEach(tk => items.push({ id: 'task-' + tk.id, title: tk.title, type: t.dashboard, tab: 'dashboard' }));
        deals.forEach(d => {
          items.push({ id: 'deal-' + d.id, title: d.name, type: t.pipeline, tab: 'pipeline' });
          d.notes.forEach(n => items.push({ id: 'note-' + n.id, title: `${d.name}: ${n.content}`, type: t.pipeline, tab: 'pipeline' }));
        });
        return items;
      }, [habits, journalEntries, tasks, deals, t]);

      const filteredSearchResults = useMemo(() => {
        if (!searchQuery.trim()) return [];
        const q = searchQuery.toLowerCase();
        return searchableItems.filter(i => i.title.toLowerCase().includes(q));
      }, [searchQuery, searchableItems]);

      const goToTab = (tab) => { setCurrentTab(tab); setIsSearchOpen(false); setIsFABOpen(false); setSearchQuery(''); };

      const NAV_ITEMS = [
        { id: 'dashboard', icon: 'dashboard', label: t.dashboard },
        { id: 'focus', icon: 'crosshair', label: t.focusMode },
        { id: 'habits', icon: 'repeat', label: t.habits },
        { id: 'journal', icon: 'bookMarked', label: t.journal },
        { id: 'pipeline', icon: 'kanban', label: t.pipeline },
        { id: 'calculator', icon: 'calculator', label: t.targetCalcNav }
      ];

      const wonRevenue = useMemo(() =>
        deals.filter(d => d.stage === 'Won').reduce((sum, d) => sum + (d.value || 0), 0),
      [deals]);

      const topPriorityTask = useMemo(() => {
        const rank = { High: 0, Medium: 1, Low: 2 };
        const open = tasks.filter(tk => !tk.completed).sort((a, b) => rank[a.priority] - rank[b.priority]);
        return open[0] || null;
      }, [tasks]);

      const hottestDeal = useMemo(() => {
        const stageWeight = { Negotiation: 3, Proposal: 2, Discovery: 1, Lead: 0 };
        const active = deals.filter(d => d.stage !== 'Won' && d.stage !== 'Lost');
        if (active.length === 0) return null;
        return [...active].sort((a, b) => (stageWeight[b.stage] - stageWeight[a.stage]) || (b.value - a.value))[0];
      }, [deals]);

      const habitStats = useMemo(() => {
        if (habits.length === 0) return { pct: 0, bestStreak: 0, weakest: null };
        const doneToday = habits.filter(h => h.completedToday).length;
        const pct = Math.round((doneToday / habits.length) * 100);
        const bestStreak = Math.max(0, ...habits.map(h => h.streak));
        const weakest = [...habits].sort((a, b) => a.streak - b.streak)[0];
        return { pct, bestStreak, weakest };
      }, [habits]);

      const buildFunnel = (targetAmount, avgDeal, closeRate, meetingRate, workingDays) => {
        if (!targetAmount || !avgDeal || targetAmount <= 0 || avgDeal <= 0) return null;
        const deals = targetAmount / avgDeal;
        const visits = (closeRate && closeRate > 0) ? deals / (closeRate / 100) : null;
        const calls = (visits !== null && meetingRate && meetingRate > 0) ? visits / (meetingRate / 100) : null;
        const dealsR = Math.ceil(deals);
        const visitsR = visits !== null ? Math.ceil(visits) : null;
        const callsR = calls !== null ? Math.ceil(calls) : null;
        const perDay = (workingDays && workingDays > 0) ? {
          deals: Math.ceil(dealsR / workingDays * 10) / 10,
          visits: visitsR !== null ? Math.ceil(visitsR / workingDays) : null,
          calls: callsR !== null ? Math.ceil(callsR / workingDays) : null
        } : null;
        return { dealsR, visitsR, callsR, perDay };
      };

      const calcResults = useMemo(() => {
        const target = Math.max(0, parseFloat(calcForm.targetRevenue) || 0);
        const avgDeal = Math.max(0, parseFloat(calcForm.avgDealValue) || 0);
        const closeRate = Math.min(100, Math.max(0, parseFloat(calcForm.closeRate) || 0));
        const meetingRate = Math.min(100, Math.max(0, parseFloat(calcForm.meetingRate) || 0));
        const workingDays = Math.max(1, parseFloat(calcForm.workingDays) || 22);

        const total = buildFunnel(target, avgDeal, closeRate, meetingRate, workingDays);
        if (!total) return null;

        const progressPct = target > 0 ? Math.min(100, Math.round((wonRevenue / target) * 100)) : 0;
        const remainingAmount = Math.max(0, target - wonRevenue);
        const remaining = remainingAmount > 0 ? buildFunnel(remainingAmount, avgDeal, closeRate, meetingRate, workingDays) : null;

        return { ...total, target, wonRevenue, progressPct, remainingAmount, remaining };
      }, [calcForm, wonRevenue]);

      const addPaceTasksToMatrix = () => {
        if (!calcResults || !calcResults.remaining || !calcResults.remaining.perDay) return;
        const pace = calcResults.remaining.perDay;
        const newTasks = [];
        if (pace.calls) {
          const roundedCalls = Math.ceil(pace.calls);
          newTasks.push({
            id: 't' + Date.now() + 'c',
            title: `${t.callsNeeded}: ${roundedCalls} ${lang === 'ar' ? 'مكالمات استكشافية' : 'calls'}`,
            duration: 20, completed: false, category: 'Call', priority: 'High', fromCalculator: true
          });
        }
        if (pace.visits) {
          const roundedVisits = Math.ceil(pace.visits);
          newTasks.push({
            id: 't' + Date.now() + 'v',
            title: `${t.visitsNeeded}: ${roundedVisits} ${lang === 'ar' ? 'مقابلات / عروض' : 'meetings'}`,
            duration: 45, completed: false, category: 'Followup', priority: 'High', fromCalculator: true
          });
        }
        if (newTasks.length) {
          setTasks([...tasks, ...newTasks]);
          showToast(t.tasksAddedToMatrix);
          setCurrentTab('dashboard');
        }
      };

      const tasksByPriority = useMemo(() => {
        const grouped = { High: [], Medium: [], Low: [] };
        tasks.forEach(tk => { (grouped[tk.priority] || grouped.Medium).push(tk); });
        return grouped;
      }, [tasks]);

      const completedCount = tasks.filter(tk => tk.completed).length;
      const completedPct = tasks.length > 0 ? Math.round((completedCount / tasks.length) * 100) : 0;
      const deepWorkHours = Math.floor(totalFocusMinutes / 60);
      const deepWorkMins = totalFocusMinutes % 60;

      const TaskCard = ({ tk }) => (
        <div className={`group-item p-3 rounded-xl border bg-zinc-800/40 space-y-2 ${tk.fromCalculator ? 'border-amber-500/40 ring-1 ring-amber-500/10' : 'border-zinc-700/50'}`}>
          <div className="flex items-start gap-2.5">
            <button onClick={() => toggleTask(tk.id)} aria-label={tk.completed ? t.markUndone : t.markDone}
              className={`w-5 h-5 mt-0.5 rounded-md border flex items-center justify-center transition-all shrink-0 ${tk.completed ? 'bg-emerald-500 border-emerald-500 text-slate-950 font-bold' : 'border-slate-600 hover:border-amber-400'}`}>
              {tk.completed && <Icon name="check" className="w-3.5 h-3.5" />}
            </button>
            <div className="flex-1 min-w-0">
              <p className={`text-xs font-semibold break-words ${tk.completed ? 'line-through text-slate-500' : 'text-slate-200'}`}>{tk.title}</p>
              <div className="flex items-center flex-wrap gap-1.5 mt-1.5">
                <span className={`inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md text-[10px] font-bold border ${CATEGORY_COLORS[tk.category] || CATEGORY_COLORS.Admin}`}>
                  <Icon name={CATEGORY_ICONS[tk.category] || 'tag'} className="w-2.5 h-2.5" />{t['category' + tk.category]}
                </span>
                <span className="text-[10px] text-slate-400 font-mono">{tk.duration}m</span>
                {tk.fromCalculator && (
                  <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md text-[10px] font-bold text-amber-400 bg-amber-500/10" title={t.targetCalc}>
                    <Icon name="calculator" className="w-2.5 h-2.5" />
                  </span>
                )}
              </div>
            </div>
            <button onClick={() => deleteTask(tk.id)} aria-label={t.delete} className="reveal-on-hover shrink-0 p-1 rounded-md text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 transition-all">
              <Icon name="trash" className="w-3.5 h-3.5" />
            </button>
          </div>
        </div>
      );

      const focusedTask = tasks.find(tk => tk.id === focusTaskId) || null;

      return (
        <div className={`min-h-screen font-sans ${theme === 'dark' ? 'bg-[#09090b] text-slate-100' : 'bg-slate-50 text-slate-800'} transition-colors duration-200 flex flex-col md:flex-row`}>

          {/* SIDEBAR NAVIGATION */}
          <aside className={`w-full md:w-64 border-b md:border-b-0 ${isRTL ? 'md:border-l' : 'md:border-r'} ${theme === 'dark' ? 'border-zinc-800 bg-[#0c0c0e]' : 'border-slate-200 bg-white'} flex flex-col justify-between shrink-0 p-4`}>
            <div>
              <div className="flex items-center gap-3 mb-5 px-2">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 via-indigo-600 to-cyan-400 flex items-center justify-center text-white shadow-lg shrink-0">
                  <Icon name="compass" className="w-5 h-5 text-white" />
                </div>
                <div>
                  <h1 className="font-extrabold text-base leading-none text-slate-100">{t.appName}</h1>
                  <span className="text-[10px] text-amber-400 font-semibold tracking-wide">{t.appSub}</span>
                </div>
              </div>

              {/* ACCOUNT / GUEST STATUS PILL */}
              <div className="p-2.5 mb-4 rounded-xl bg-zinc-800/40 border border-zinc-700/50 flex flex-col gap-2">
                <div className="flex items-center justify-between gap-1 text-[11px]">
                  <span className="flex items-center gap-1.5 font-bold truncate">
                    <span className={`w-2 h-2 rounded-full ${session.isGuest ? 'bg-amber-400 animate-pulse' : 'bg-emerald-400'}`}></span>
                    <span className={session.isGuest ? 'text-amber-400' : 'text-slate-200'}>
                      {session.isGuest ? t.guestMode : session.email}
                    </span>
                  </span>
                  {session.isGuest ? (
                    <button onClick={() => setIsAuthModalOpen(true)}
                      className="px-2 py-0.5 rounded-md bg-amber-500 text-slate-950 font-bold text-[10px] hover:bg-amber-400 transition-all shadow-sm">
                      {t.loginOrSignup}
                    </button>
                  ) : (
                    <button onClick={handleLogout}
                      className="text-[10px] font-bold text-rose-400 hover:underline">
                      {t.logout}
                    </button>
                  )}
                </div>
                {session.isGuest && (
                  <p className="text-[9.5px] text-slate-500 leading-tight">
                    {t.guestNotice}
                  </p>
                )}
              </div>

              <div className="p-3 mb-4 rounded-xl bg-gradient-to-r from-amber-500/10 via-indigo-500/10 to-transparent border border-amber-500/20 text-[11px] font-medium text-amber-200/90 leading-snug">
                💡 "{t.questionOfDay}"
              </div>

              <nav className="space-y-1">
                {NAV_ITEMS.map(item => {
                  const active = currentTab === item.id;
                  return (
                    <button key={item.id} onClick={() => setCurrentTab(item.id)}
                      className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                        active ? 'bg-amber-500/15 text-amber-400 border border-amber-500/30 shadow-sm' : 'text-slate-400 hover:bg-zinc-800/60 hover:text-slate-200'
                      }`}>
                      <Icon name={item.icon} className={`w-4 h-4 ${active ? 'text-amber-400' : 'text-slate-400'}`} />
                      <span>{item.label}</span>
                    </button>
                  );
                })}
              </nav>
            </div>

            <div className="mt-4 pt-3 border-t border-zinc-800/60 space-y-2">
              <button onClick={() => runAICoachAnalysis()}
                className="w-full rounded-xl p-3 bg-gradient-to-r from-indigo-900/40 via-purple-900/30 to-slate-900 border border-indigo-500/30 hover:border-indigo-500/60 transition-all text-left">
                <div className="flex items-center gap-2.5">
                  <div className="p-1.5 rounded-lg bg-indigo-500/20 text-indigo-400 shrink-0">
                    <Icon name="brain" className="w-4 h-4" />
                  </div>
                  <div>
                    <p className="text-xs font-bold text-indigo-200 flex items-center gap-1">
                      {t.aiCoach}
                      <Icon name="sparkles" className="w-3 h-3 text-amber-400" />
                    </p>
                    <p className="text-[10px] text-indigo-300/70">{t.aiCoachSub}</p>
                  </div>
                </div>
              </button>
            </div>

                      </div>
                    </div>
                    <button onClick={() => setIsAICoachOpen(false)} aria-label={t.close} className="p-1 text-slate-400 hover:text-white">
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  </div>

                  {/* Optional Gemini API Key */}
                  <div className="p-3 rounded-xl bg-zinc-800/40 border border-zinc-700/50 space-y-2">
                    <div className="flex items-center justify-between text-[11px]">
                      <span className="text-slate-400 font-medium flex items-center gap-1">
                        <Icon name="key" className="w-3.5 h-3.5 text-amber-400" />
                        {t.apiKeyOptional}
                      </span>
                      <button onClick={() => setIsEditingKey(!isEditingKey)} className="text-[10px] text-amber-400 hover:underline">
                        {isEditingKey ? t.close : (geminiApiKey ? 'تعديل' : 'إضافة')}
                      </button>
                    </div>
                    {isEditingKey && (
                      <div className="flex gap-2 pt-1">
                        <input type="password" value={geminiApiKey} onChange={e => setGeminiApiKey(e.target.value)}
                          placeholder="AIzaSy..."
                          className="flex-1 p-2 rounded-lg bg-zinc-800 border border-zinc-700 text-xs text-slate-100 outline-none focus:border-amber-500" />
                        <button onClick={() => { localStorage.setItem(LS_GEMINI_KEY, geminiApiKey); setIsEditingKey(false); showToast(t.save); }}
                          className="px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold text-xs hover:bg-amber-400">
                          {t.saveApiKey}
                        </button>
                      </div>
                    )}
                  </div>

                  {isAiLoading ? (
                    <div className="flex flex-col items-center justify-center py-12 text-xs text-amber-400 gap-3">
                      <Icon name="sparkles" className="w-6 h-6 animate-spin text-amber-400" />
                      <span>{t.aiAnalyzing}</span>
                    </div>
                  ) : (
                    <div className="p-4 rounded-xl bg-indigo-950/20 border border-indigo-500/20 text-xs text-slate-200 leading-relaxed whitespace-pre-line shadow-inner">
                      {aiCoachResponse}
                    </div>
                  )}
                </div>

                <button onClick={() => setIsAICoachOpen(false)}
                  className="w-full py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs hover:bg-amber-400 transition-all shadow-md">
                  {t.applyCoaching}
                </button>
              </div>
            </div>
          )}

          {/* AUTH MODAL FOR GUESTS */}
          <AuthModal isOpen={isAuthModalOpen} onClose={() => setIsAuthModalOpen(false)}
            t={t} onLoginSuccess={handleLoginSuccess}
            currentGuestData={{ habits, journalEntries, tasks, deals, calcForm, totalFocusMinutes }} />

          {/* GLOBAL TOAST */}
          {toast && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl bg-zinc-900 border border-amber-500/40 shadow-2xl text-xs font-semibold text-slate-100 animate-fadeIn">
              {toast}
            </div>
          )}

          {/* FLOATING ACTION BUTTON (FAB) */}
          <div className={`fixed bottom-6 ${isRTL ? 'left-6' : 'right-6'} z-40 flex flex-col items-end gap-2`}>
            {isFABOpen && (
              <div className="flex flex-col gap-2 animate-fadeIn">
                <button onClick={() => { setIsFABOpen(false); setIsTaskModalOpen(true); }} className="px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-700 text-xs font-semibold text-slate-200 hover:border-amber-500 shadow-lg flex items-center gap-2">
                  <Icon name="grid" className="w-3.5 h-3.5 text-amber-400" />{t.addTask}
                </button>
                <button onClick={() => { setIsFABOpen(false); setIsJournalModalOpen(true); }} className="px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-700 text-xs font-semibold text-slate-200 hover:border-amber-500 shadow-lg flex items-center gap-2">
                  <Icon name="bookMarked" className="w-3.5 h-3.5 text-amber-400" />{t.writeJournalEntry}
                </button>
                <button onClick={() => goToTab('habits')} className="px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-700 text-xs font-semibold text-slate-200 hover:border-amber-500 shadow-lg flex items-center gap-2">
                  <Icon name="repeat" className="w-3.5 h-3.5 text-cyan-400" />{t.addHabit}
                </button>
                <button onClick={() => { setIsFABOpen(false); setIsDealModalOpen(true); }} className="px-4 py-2 rounded-xl bg-zinc-900 border border-zinc-700 text-xs font-semibold text-slate-200 hover:border-amber-500 shadow-lg flex items-center gap-2">
                  <Icon name="kanban" className="w-3.5 h-3.5 text-rose-400" />{t.addDeal}
                </button>
              </div>
            )}
            <button onClick={() => setIsFABOpen(!isFABOpen)} aria-label={t.quickAction}
              className="w-14 h-14 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-2xl flex items-center justify-center transition-all" title={t.quickAction}>
              <Icon name={isFABOpen ? 'x' : 'plus'} className="w-6 h-6" />
            </button>
          </div>

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<SalesOSApp />);
  </script>
</body>
</html>
